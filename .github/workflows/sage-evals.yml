name: Sage Evals

# Live model evals for Sage. Separate from the main `CI` workflow because they
# (a) call a model (cost + an API key secret) and (b) are non-deterministic,
# so they don't belong on the hard PR gate for every change. The sage-evals
# job calls the production model through OpenRouter (OPENROUTER_API_KEY); the
# memory job still needs GEMINI_API_KEY, because its evals store embeddings.
#
# Triggers: on-demand, nightly, and on PRs that touch Sage's prompt/tools/evals.
# When the key is not configured the live steps no-op with a NOT RUN line in
# the job summary (so forks and secret-less environments stay green).
on:
  workflow_dispatch:
  schedule:
    - cron: "27 7 * * *" # nightly ~07:27 UTC
  pull_request:
    branches: [main]
    paths:
      - "src/lib/sage/**"
      - "config/sage-*.json"
      - "scripts/sage-*.mjs"
      - "scripts/lib/**"
      - "scripts/run-sage-eval-step.sh"
      - ".github/workflows/sage-evals.yml"

jobs:
  sage-evals:
    runs-on: ubuntu-latest
    env:
      # Importing the tool registry pulls in the Prisma client; a fake URL is
      # fine because no eval connects to a database (the model calls are HTTP).
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake"
      JWT_SECRET: "ci-test-secret-not-real-at-all-32"
      API_KEY_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      APP_BASE_URL: "http://localhost:3000"
      # The production model through OpenRouter, on synthetic eval data only
      # (docs/runbooks/openrouter-test-bench.md). Every request asks for zero
      # data retention and no training.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: google/gemini-3.1-flash-lite
      # The budget is the CI key's own monthly spending limit on OpenRouter,
      # which replaces the Gemini-era GEMINI_EVAL_BUDGET_OK opt-in. A run that
      # hits the limit exits 3, and scripts/run-sage-eval-step.sh reports it as
      # NOT RUN and fails the step, because an ungraded scenario is not a pass.
      # SAGE_EVAL_SOFT_FAIL=1 (repo variable) lets that outcome pass instead.
      # See docs/runbooks/sage-eval-budget.md.
      SAGE_EVAL_SOFT_FAIL: ${{ vars.SAGE_EVAL_SOFT_FAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Print Sage prompt revision
        # Attribution tag for this run's results — grep the source directly so
        # the step works before npm ci and never affects job gating.
        run: grep -o 'SAGE_PROMPT_REVISION = "[^"]*"' src/lib/sage/prompt-revision.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate

      # --deidentify=Sam,Ms. Lee wraps the eval provider in the same
      # de-identification decorator production applies to a cloud
      # student_record call, so the gating evals measure the SHIPPED
      # configuration rather than a prompt no student will ever produce. The
      # two names match the personas sage-redteam-eval.mjs already hard-codes
      # (studentName "Sam", teacher persona "Ms. Lee"). This is a NEW
      # measurement: if a scenario reds on a placeholder, that is a finding
      # about the layer, never a reason to loosen a fixture.
      - name: Red-team eval (gating — hard boundary violations fail the run)
        run: scripts/run-sage-eval-step.sh "Red-team eval" npm run sage:redteam:eval -- --provider=openrouter "--deidentify=Sam,Ms. Lee"

      # Informational: without its Gemini judge the quality eval has no pass
      # criterion, so through OpenRouter it reports reading levels only.
      - name: Quality eval (informational)
        continue-on-error: true
        run: scripts/run-sage-eval-step.sh "Quality eval" npm run sage:quality:eval -- --provider=openrouter

      - name: Tool-selection eval (gating when OPENROUTER_API_KEY is set; accuracy below 75% fails the run)
        run: scripts/run-sage-eval-step.sh "Tool-selection eval" npm run sage:agent:eval -- --provider=openrouter --min-accuracy=75 "--deidentify=Sam,Ms. Lee"

      - name: Chat harness — deterministic families (gating — tool + guardrail failures fail the run)
        # --samples=3: Gemini tool selection is not fully deterministic even at
        # temperature=0, so gating tool cases take a 2-of-3 majority verdict
        # instead of gating on a single draw (forbidden-tool hits in any sample
        # still fail outright). See runVotedToolCase in sage-chat-harness.mjs.
        # tool_watch runs informationally: demoted flaky cases stay visible
        # (WATCH lines + a ::warning:: annotation) without gating the run.
        run: scripts/run-sage-eval-step.sh "Chat harness" npx tsx scripts/sage-chat-harness.mjs --provider=openrouter --strict --families=tool,tool_watch,guardrail --temperature=0 --samples=3

  # Still on GEMINI_API_KEY: the memory and answer-quality evals store
  # embeddings, which come from Google's embedding API. Moving them to
  # OpenRouter needs an OpenRouter embedding provider, planned with the
  # production move. Without a Google key these steps skip with a notice.
  sage-memory-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionquest_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      JWT_SECRET: "ci-test-secret-not-real-at-all-32"
      API_KEY_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      APP_BASE_URL: "http://localhost:3000"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # See the matching block in the sage-evals job above — same guard, same
      # rationale (E8, 2026-09-07): docs/runbooks/sage-eval-budget.md.
      GEMINI_EVAL_BUDGET_OK: ${{ vars.GEMINI_EVAL_BUDGET_OK }}
      GEMINI_EVAL_BUDGET_SOFT_FAIL: ${{ vars.GEMINI_EVAL_BUDGET_SOFT_FAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Print Sage prompt revision
        # Attribution tag for this run's results — grep the source directly so
        # the step works before npm ci and never affects job gating.
        run: grep -o 'SAGE_PROMPT_REVISION = "[^"]*"' src/lib/sage/prompt-revision.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: |
          npx prisma db execute --file scripts/test-support/supabase-roles.sql --schema prisma/schema.prisma
          npx prisma migrate deploy
      - name: Answer quality on the hermetic catalog (informational during calibration)
        continue-on-error: true
        env:
          SAGE_RAG_MODE: "hybrid"
          SAGE_RAG_ABSTAIN_DISTANCE: "0.40"
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ "$GEMINI_EVAL_BUDGET_OK" != "1" ]; then
            echo "- **Answer quality**: SKIPPED — provider key or confirmed budget unavailable; not release evidence" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx tsx scripts/bench/seed-catalog-corpus.mjs --answer-quality --embed
          mkdir -p reports/sage-answer-quality
          npx tsx scripts/sage-chat-harness.mjs --provider=gemini --model=gemini-3.1-flash-lite --deidentify=Sam --families=grounding --fixture=config/sage-answer-quality-eval.json --samples=3 --temperature=0 --strict --out=reports/sage-answer-quality/catalog.json

      - name: Upload answer-quality calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-answer-quality-catalog
          path: reports/sage-answer-quality/
          if-no-files-found: ignore

      - name: Sage memory eval (gating when GEMINI_API_KEY is set — retrieval hit rate < 90% or duplicate rate >= 5% fails the run; skips when the secret is unset)
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY not set — skipping sage memory eval."
            exit 0
          fi
          if [ "$GEMINI_EVAL_BUDGET_OK" != "1" ]; then
            echo "::warning::GEMINI_EVAL_BUDGET_OK is not 1 — model-backed eval skipped (not run, not passed)"
            echo "- **Memory eval**: NOT RUN — GEMINI_EVAL_BUDGET_OK is not 1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          npm run sage:memory:eval
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::warning::Gemini budget exhausted at runtime — memory eval NOT RUN (not a pass, not a code failure)"
            echo "- **Memory eval**: NOT RUN — Gemini budget exhausted at runtime" >> "$GITHUB_STEP_SUMMARY"
            if [ "$GEMINI_EVAL_BUDGET_SOFT_FAIL" = "1" ]; then
              exit 0
            fi
          fi
          exit $status

  catalog-drift:
    # Compares each approved catalog node's expected sageContextNote against
    # the live ProgramDocument row. Needs a real, populated DATABASE_URL (not
    # the ephemeral/empty CI Postgres container used elsewhere in this repo —
    # drift is only meaningful against the actual catalog data). No such
    # secret exists in this repo today; this job no-ops with a ::notice until
    # an operator configures one. Scheduled/on-demand only (not on every PR —
    # see docs/runbooks/catalog-operations.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Catalog drift audit (no-op without a real DATABASE_URL secret)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not configured — skipping catalog:drift."
            exit 0
          fi
          npm run catalog:drift

  # Living-agent freshness eval: seeds native DB changes and asserts each is
  # visible in Sage's next context assembly. Fully deterministic (no model).
  # Flip the run line to `-- --strict` when write-through cache invalidation
  # lands, turning the documented staleness baseline into a hard gate.
  sage-freshness-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionquest_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      JWT_SECRET: "ci-test-secret-not-real-at-all-32"
      API_KEY_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      APP_BASE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: |
          npx prisma db execute --file scripts/test-support/supabase-roles.sql --schema prisma/schema.prisma
          npx prisma migrate deploy
      - name: Sage freshness eval (Group A gates the read plane; Group B reports staleness)
        run: npm run sage:freshness:eval -- --strict
