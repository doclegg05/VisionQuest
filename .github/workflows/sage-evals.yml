name: Sage Evals

# Live model evals for Sage. Separate from the main `CI` workflow because they
# (a) call a paid model API and (b) are non-deterministic, so they don't
# belong on the hard PR gate for every change.
#
# Model calls go through OpenRouter (OPENROUTER_API_KEY secret) to
# production's model, google/gemini-3.1-flash-lite. Every prompt here is a
# synthetic eval fixture: OpenRouter never sees real student data, and the
# app itself never calls it (docs/runbooks/openrouter-test-bench.md). The
# sage-memory-eval job also embeds through the app's Gemini embedding path,
# which OpenRouter does not serve, so it still needs GEMINI_API_KEY.
#
# Every model-backed step runs through scripts/lib/sage-eval-ci-step.mjs,
# which writes PASSED, REPORTED, FAILED or NOT RUN to the job summary. A step
# that could not evaluate anything never reads as a pass: see
# docs/runbooks/sage-eval-budget.md. The budget is each key's own spending
# limit; there is no opt-in variable.
#
# Keys are mapped only on the steps that call a model, never at job level, so
# setup steps such as `npm ci` (and any dependency lifecycle script they run)
# never hold one.
#
# Triggers: on-demand, nightly, and on PRs that touch Sage's prompt/tools/evals.
on:
  workflow_dispatch:
  schedule:
    - cron: "27 7 * * *" # nightly ~07:27 UTC
  pull_request:
    branches: [main]
    paths:
      - "src/lib/sage/**"
      - "config/sage-*.json"
      - "scripts/sage-*.mjs"
      - "scripts/lib/**"
      - ".github/workflows/sage-evals.yml"

permissions:
  contents: read

# A newer push to the same PR cancels the older run instead of letting it
# keep spending. Nightly and dispatched runs get their own group and are
# never cancelled.
concurrency:
  group: sage-evals-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sage-evals:
    runs-on: ubuntu-latest
    env:
      # Importing the tool registry pulls in the Prisma client; a fake URL is
      # fine because no eval connects to a database (the model calls are HTTP).
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake"
      JWT_SECRET: "ci-test-secret-not-real-at-all-32"
      API_KEY_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      APP_BASE_URL: "http://localhost:3000"
      # No step in this job gets GEMINI_API_KEY: nothing here may call Google
      # directly, so the quality eval also runs without its Gemini judge.
      # What CI measures: production's model, through OpenRouter. Pinned to
      # DEFAULT_GEMINI_MODEL by src/lib/ci-sage-evals-openrouter.test.ts.
      OPENROUTER_MODEL: google/gemini-3.1-flash-lite
      # "true" on this repository's own runs (nightly, dispatch, and PRs from a
      # branch here), "false" on fork PRs, which never receive secrets. A
      # required run with a missing secret fails instead of skipping green.
      SAGE_EVAL_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # A run that hits a key's spending limit exits 3, and a refused key or
      # model exits 4. Both read NOT RUN and fail the step unless the repo
      # variable SAGE_EVAL_SOFT_FAIL is 1. See docs/runbooks/sage-eval-budget.md.
      SAGE_EVAL_SOFT_FAIL: ${{ vars.SAGE_EVAL_SOFT_FAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Print Sage prompt revision
        # Attribution tag for this run's results — grep the source directly so
        # the step works before npm ci and never affects job gating.
        run: grep -o 'SAGE_PROMPT_REVISION = "[^"]*"' src/lib/sage/prompt-revision.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate

      # The eval harness's own tests, before anything spends money: the
      # provider resolver, the NOT RUN classifiers, and end-to-end checks that
      # each eval and the embedding preflight exit 3 or 4 against stubbed
      # providers. No key and no network.
      - name: Eval harness tests (no model calls)
        timeout-minutes: 15
        run: npx tsx --test scripts/lib/sage-eval-provider.test.mjs scripts/lib/eval-abort.e2e.test.mjs

      # --deidentify=Sam,Ms. Lee wraps the eval provider in the same
      # de-identification decorator production applies to a cloud
      # student_record call, so the gating evals measure the SHIPPED
      # configuration rather than a prompt no student will ever produce. The
      # two names match the personas sage-redteam-eval.mjs already hard-codes
      # (studentName "Sam", teacher persona "Ms. Lee"). This is a NEW
      # measurement: if a scenario reds on a placeholder, that is a finding
      # about the layer, never a reason to loosen a fixture.
      # Red-team results through OpenRouter are close to production but not
      # identical: OpenRouter cannot pass production's Gemini safetySettings
      # (BLOCK_ONLY_HIGH for dangerous content), so a reply here is the model
      # on OpenRouter's defaults.
      - name: Red-team eval (gating — hard boundary violations fail the run)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          node scripts/lib/sage-eval-ci-step.mjs --label="Red-team eval" --
          npm run sage:redteam:eval -- --provider=openrouter "--deidentify=Sam,Ms. Lee"

      # No pass criterion: without its Gemini judge (--judge=gemini calls
      # Google directly) this reports replies and their reading level only.
      # The summary says REPORTED, never PASSED. continue-on-error: a NOT RUN
      # or a failure here shows on the step and in the summary but never
      # fails the job.
      - name: Quality eval (informational — replies and reading level, no judge)
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          node scripts/lib/sage-eval-ci-step.mjs --label="Quality eval" --informational --
          npm run sage:quality:eval -- --provider=openrouter

      - name: Tool-selection eval (gating — accuracy < 75% fails the run)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          node scripts/lib/sage-eval-ci-step.mjs --label="Tool-selection eval" --
          npm run sage:agent:eval -- --provider=openrouter --min-accuracy=75 "--deidentify=Sam,Ms. Lee"

      - name: Chat harness — deterministic families (gating — tool + guardrail failures fail the run)
        # --samples=3: Gemini tool selection is not fully deterministic even at
        # temperature=0, so gating tool cases take a 2-of-3 majority verdict
        # instead of gating on a single draw (forbidden-tool hits in any sample
        # still fail outright). See runVotedToolCase in sage-chat-harness.mjs.
        # tool_watch runs informationally: demoted flaky cases stay visible
        # (WATCH lines + a ::warning:: annotation) without gating the run.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          node scripts/lib/sage-eval-ci-step.mjs --label="Chat harness" --
          npx tsx scripts/sage-chat-harness.mjs --provider=openrouter --strict --families=tool,tool_watch,guardrail --temperature=0 --samples=3

  sage-memory-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionquest_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      JWT_SECRET: "ci-test-secret-not-real-at-all-32"
      API_KEY_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      APP_BASE_URL: "http://localhost:3000"
      # Generation goes through OpenRouter, as in the sage-evals job above.
      # Its two model steps also get GEMINI_API_KEY, for embeddings only:
      # memory storage, memory retrieval and hybrid RAG embed through the
      # app's resolver (gemini-embedding-001), and OpenRouter has no embedding
      # path in this repo. Both pass --needs-gemini-embeddings, which checks
      # the key with one embedding call before the eval and again after a
      # failed one, so a refused key or a drained wallet reads NOT RUN.
      # What CI measures: production's model, through OpenRouter. Pinned to
      # DEFAULT_GEMINI_MODEL by src/lib/ci-sage-evals-openrouter.test.ts.
      OPENROUTER_MODEL: google/gemini-3.1-flash-lite
      # "true" on this repository's own runs (nightly, dispatch, and PRs from a
      # branch here), "false" on fork PRs, which never receive secrets. A
      # required run with a missing secret fails instead of skipping green.
      SAGE_EVAL_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # A run that hits a key's spending limit exits 3, and a refused key or
      # model exits 4. Both read NOT RUN and fail the step unless the repo
      # variable SAGE_EVAL_SOFT_FAIL is 1. See docs/runbooks/sage-eval-budget.md.
      SAGE_EVAL_SOFT_FAIL: ${{ vars.SAGE_EVAL_SOFT_FAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Print Sage prompt revision
        # Attribution tag for this run's results — grep the source directly so
        # the step works before npm ci and never affects job gating.
        run: grep -o 'SAGE_PROMPT_REVISION = "[^"]*"' src/lib/sage/prompt-revision.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: |
          npx prisma db execute --file scripts/test-support/supabase-roles.sql --schema prisma/schema.prisma
          npx prisma migrate deploy
      - name: Answer quality on the hermetic catalog (informational during calibration)
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAGE_RAG_MODE: "hybrid"
          SAGE_RAG_ABSTAIN_DISTANCE: "0.40"
        # Seeds the catalog with embeddings, then runs the grounding family.
        # Not release evidence while it calibrates. continue-on-error: a NOT
        # RUN or a failure here never fails the job.
        run: >-
          node scripts/lib/sage-eval-ci-step.mjs --label="Answer quality" --informational --needs-gemini-embeddings --
          bash -c 'set -e;
          npx tsx scripts/bench/seed-catalog-corpus.mjs --answer-quality --embed;
          mkdir -p reports/sage-answer-quality;
          npx tsx scripts/sage-chat-harness.mjs --provider=openrouter --deidentify=Sam --families=grounding --fixture=config/sage-answer-quality-eval.json --samples=3 --temperature=0 --strict --out=reports/sage-answer-quality/catalog.json'

      - name: Upload answer-quality calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-answer-quality-catalog
          path: reports/sage-answer-quality/
          if-no-files-found: ignore

      - name: Sage memory eval (gating — retrieval hit rate < 90% or duplicate rate >= 5% fails the run)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          node scripts/lib/sage-eval-ci-step.mjs --label="Memory eval" --needs-gemini-embeddings --
          npm run sage:memory:eval -- --provider=openrouter

  catalog-drift:
    # Compares each approved catalog node's expected sageContextNote against
    # the live ProgramDocument row. Needs a real, populated DATABASE_URL (not
    # the ephemeral/empty CI Postgres container used elsewhere in this repo —
    # drift is only meaningful against the actual catalog data). No such
    # secret exists in this repo today; this job no-ops with a ::notice until
    # an operator configures one. Scheduled/on-demand only (not on every PR —
    # see docs/runbooks/catalog-operations.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Catalog drift audit (no-op without a real DATABASE_URL secret)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not configured — skipping catalog:drift."
            exit 0
          fi
          npm run catalog:drift

  # Living-agent freshness eval: seeds native DB changes and asserts each is
  # visible in Sage's next context assembly. Fully deterministic (no model).
  # Flip the run line to `-- --strict` when write-through cache invalidation
  # lands, turning the documented staleness baseline into a hard gate.
  sage-freshness-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionquest_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/visionquest_ci"
      JWT_SECRET: "ci-test-secret-not-real-at-all-32"
      API_KEY_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      APP_BASE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: |
          npx prisma db execute --file scripts/test-support/supabase-roles.sql --schema prisma/schema.prisma
          npx prisma migrate deploy
      - name: Sage freshness eval (Group A gates the read plane; Group B reports staleness)
        run: npm run sage:freshness:eval -- --strict
