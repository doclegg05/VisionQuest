services:
  - type: web
    name: visionquest
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Both of these were set in the Render dashboard only, so this file did
      # not show that production depends on them and a fresh service created
      # from it would have started with RLS unenforced and prismaAdmin
      # unprivileged — silently, in both cases. src/lib/boot-probes.ts now
      # refuses to boot production without them; they are listed here so the
      # blueprint says so too.
      #
      # ADMIN_DATABASE_URL is the `postgres` role (RLS-bypassing) that
      # prismaAdmin uses for crons, job handlers and pre-auth routes. Unset, it
      # falls back to DATABASE_URL (`vq_app`) and every cross-student read
      # returns zero rows.
      - key: ADMIN_DATABASE_URL
        sync: false
      # Compared against this exact string in src/lib/db.ts. Anything else and
      # the Prisma RLS extension runs every query with no session context.
      - key: RLS_CONTEXT_INJECTION
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_KEY
        sync: false
      - key: API_KEY_ENCRYPTION_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Optional, and unused while AI_LOCAL_ONLY below is "true": every cloud
      # call is refused before it is sent. Production runs Sage on a local
      # model and has no Gemini key. Adding a key here does not turn cloud AI
      # on.
      - key: GEMINI_API_KEY
        sync: false
      # Cloud AI block. The owner's standing decision is that no student data
      # goes to a cloud model. src/lib/boot-probes.ts refuses to boot
      # production unless the deployment says which it is: local only, or
      # cloud allowed on purpose. "true" here is the local only answer. It
      # refuses every Gemini and OpenRouter call for the whole service,
      # background work included (src/lib/ai/demo-local-only.ts). The older
      # switches COHORT_DEMO_LOCAL_ONLY and COHORT_DEMO_MODE do the same but
      # are named for the demo; this one stays when the demo variables go.
      # Cloud AI is allowed only by AI_CLOUD_INFERENCE set to exactly
      # "allowed", after a written owner decision. It is left out of this file
      # on purpose, and setting it beside this switch stops the boot.
      - key: AI_LOCAL_ONLY
        value: "true"
      # The one local endpoint origin Sage may call while the block is on. This
      # is the relay's adapter inside this service, not the Mac. A saved
      # provider URL with any other origin is refused before any network call.
      # The older name is COHORT_DEMO_LOCAL_AI_ORIGIN; if both are set they
      # must name the same origin.
      - key: AI_LOCAL_APPROVED_ORIGIN
        value: "http://127.0.0.1:11437"
      # Mac relay (docs/runbooks/mac-sage-connection.md). Production sets this
      # to "true": scripts/start-production.mjs then starts the relay that
      # carries Sage's prompts to the Mac's local model, and it also turns the
      # cloud AI block on. No value here, so turning the relay off in the
      # dashboard stays off.
      - key: VQ_MAC_RELAY_ENABLED
        sync: false
      # The Mac agent proves itself to the relay with this token. 64 lowercase
      # hex characters. The same value goes in the Mac agent's private config.
      - key: VQ_MAC_RELAY_AGENT_TOKEN
        sync: false
      # The app proves itself to the relay's adapter with this token. Its own
      # value, same format. It is never sent to the Mac.
      - key: VQ_MAC_RELAY_APP_TOKEN
        sync: false
      # Risk-tiered agent enablement. "off" | "readonly" | "full".
      # Stage 6a (readonly) entered 2026-07-08 per docs/runbooks/sage-agent-enablement.md:
      # preconditions green same day (red-team --strict: 0 hard violations;
      # chat harness tool 4/4 + guardrail 5/5 at temperature 0).
      # Do NOT advance to "full" without the 6b preconditions + a monitoring window.
      - key: SAGE_AGENT_MODE
        value: "readonly"
      # DEPRECATED: superseded by SAGE_AGENT_MODE. Kept only as a back-compat
      # fallback (unset MODE + this "false" still resolves to off). Remove once
      # SAGE_AGENT_MODE is the sole control.
      - key: SAGE_AGENT_ENABLED
        value: "false"
      - key: SAGE_RAG_ABSTAIN_DISTANCE
        value: "0.40"
      - key: CF_ACCESS_CLIENT_ID
        sync: false
      - key: CF_ACCESS_CLIENT_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: us-east-1
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # Held by the external intake automation (Power Automate). Deliberately
      # NOT CRON_SECRET: src/lib/csrf.ts has no fallback between them, so a
      # leak on the vendor side cannot reach /api/internal/*. Generated here so
      # the route is never unauthenticated-by-absence; read it out of the Render
      # dashboard to configure the vendor.
      - key: INTAKE_WEBHOOK_SECRET
        generateValue: true
      # Signs the QR verification tokens on issued intake packets
      # (src/app/api/verify/document). Rotating it invalidates the QR codes on
      # packets already printed, so treat it as long-lived.
      - key: DOCUMENT_VERIFICATION_SECRET
        generateValue: true
      # SMS (Match & Connect Phase 5) — optional, and unset means OFF at every
      # level: sendSms is a no-op and /api/sms/inbound rejects every request.
      # TWILIO_AUTH_TOKEN also verifies Twilio's inbound X-Twilio-Signature.
      # Enable steps: docs/runbooks/connect-nudges.md
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      # Phase 2: set to "true" to enable S3 presigned download URLs.
      # See docs/plans/presigned-urls-runbook.md.
      - key: USE_PRESIGNED_URLS
        sync: false
# Cron jobs moved to Supabase pg_cron in Phase 1 of the Supabase optimization.
# See prisma/migrations/20260421000000_add_pg_cron_jobs and
# docs/plans/pg-cron-setup-runbook.md. The scripts/run-*.mjs files are kept
# as manual-trigger fallbacks.
